name: CI/CD com Docker Compose

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: build-placeholder
      DB_ROOT_PASSWORD: build-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar Compose
        run: docker compose config -q

      - name: Build da imagem
        run: docker compose build app

      - name: Login no Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username wilzinho --password-stdin

      - name: Publicar imagem
        run: docker compose push app

  test:
    needs: build-publish
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.TEST_DB_ROOT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username wilzinho --password-stdin

      - name: Baixar imagem publicada
        run: docker compose pull app

      - name: Subir aplicação e banco
        run: docker compose up -d --no-build db app

      - name: Testar resposta HTTP
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://localhost:8081/; then
              echo "Aplicacao respondeu com sucesso!"
              exit 0
            fi

            echo "Tentativa $i de 40. Aguardando a aplicacao..."
            sleep 3
          done

          echo "A aplicacao nao respondeu no tempo esperado."
          docker compose ps -a
          docker compose logs --no-color app db
          exit 1

      - name: Encerrar containers
        if: always()
        run: docker compose down -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Atualizar aplicação no Azure
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name mural-flask \
              --resource-group rg-terraform-aula10 \
              --image wilzinho/mural-flask:latest
